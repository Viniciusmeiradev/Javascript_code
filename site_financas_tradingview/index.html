<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <title>Tradingview Finanças</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<body>
    <header class="bg-black border-b px-6 py-3 flex items-center shadow-xs">

        </div>

        <div class="relative w-72">

                <svg class="w-4 h-4" fill="none" stroke="currentColor"
                     viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </span>

            <input type="text" placeholder="Pesquise" class="w-full bg-[#f0f3fa] text-sm pl-9 pr-4 py-1.5 rounded-lg border border-transparent focus:bg-white focus:border-blue-500 outline-none transition">
        </div>
    </div>

    <nav class="ml-auto flex items-center gap-4 font-medium text-white">
        <a href="#" class="hover:text-blue-600 transition">Início</a>
        <a href="#" class="hover:text-blue-600 transition">Produtos</a>

        <a href="#" class="hover:text-blue-600 transition">Suporte</a>

        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-poppins text-sm hover:text-blue-400 transition">Entrar</button>
    </nav>
</header>
<body>
    <main>
        <section class="lg:col-span-2  bg-blue border border-blue rounded-2xl p-6 shadow-xs flex flex-col justify-between">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center space-x-2">
                    <h2 class="w-8 h-8 rounded-full bg-red-600 text-white font-bold flex items-center justify-center text-xs">IBOV</h2>
                    <span class="font-bold text-lg text-gray-900">Ibovespa</span>
                    <span class="text-xs bg-gray-100 px-1 py-1 rounded text-gray-600 font-semibold border">IBOV</span>
                </div>
                
            </div>
        </section>
    </main>
